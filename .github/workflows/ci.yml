name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Fails the pipeline (and blocks deploy) if there's any lint issue —
      # no error/warning/info is allowed to reach production.
      - name: Lint (flutter analyze)
        run: flutter analyze

      - name: Test (flutter test)
        run: flutter test

      # --no-web-resources-cdn bundles CanvasKit locally (build/web/canvaskit/)
      # instead of loading it from gstatic.com by default. Keeps the CSP in
      # web/index.html simple (no third-party script-src needed) and avoids
      # depending on an external CDN being reachable.
      - name: Build web (release)
        run: flutter build web --release --no-web-resources-cdn

  deploy:
    name: Deploy to Vercel
    needs: lint-build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn

      # amondnet/vercel-action pins an outdated Vercel CLI (25.x) that the
      # current Vercel API rejects ("CLI version is outdated"). Calling the
      # CLI directly with @latest avoids that pin entirely.
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy build/web to Vercel
        working-directory: ./build/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
